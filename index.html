<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>ANIME // SIGNAL</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=DM+Mono:wght@400;500&family=Inter:wght@500;700;800&display=swap');
:root{--ink:#08090c;--paper:#eeeae0;--red:#ef3c36;--yellow:#ffd43b;--cyan:#68d7df}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink);color:var(--paper);font-family:Inter,sans-serif}button{font:inherit;color:inherit}
body{background:linear-gradient(145deg,#101217 0%,#090a0d 70%)}
.app{position:relative;width:100%;height:100%;display:grid;grid-template-rows:74px 1fr 84px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid #303239;background:rgba(8,9,12,.92);z-index:10}
.logo{font-family:'Black Han Sans',Impact,sans-serif;font-size:22px;letter-spacing:-1px}.logo b{color:var(--red)}
.stats{display:flex;gap:38px;align-items:center}.stat{display:flex;flex-direction:column}.stat small{font-family:'DM Mono';font-size:9px;color:#777b85;letter-spacing:2px}.stat strong{font-family:'DM Mono';font-size:16px;margin-top:3px}.energy{width:140px;height:7px;border:1px solid #555a66;transform:skew(-12deg);overflow:hidden}.energy i{display:block;width:67%;height:100%;background:var(--red);box-shadow:0 0 12px var(--red);transition:.3s}
.main{position:relative;display:grid;grid-template-columns:minmax(280px,1.05fr) minmax(420px,1.55fr) 310px;gap:12px;padding:12px;min-height:0}
.panel{position:relative;overflow:hidden;border:1px solid #343740;background:#0d0f14}.panel-label{position:absolute;left:14px;top:12px;z-index:5;font-family:'DM Mono';font-size:9px;letter-spacing:2px;color:#9296a1}.panel-label:before{content:'';display:inline-block;width:6px;height:6px;margin-right:7px;background:var(--red);border-radius:50%;box-shadow:0 0 8px var(--red)}
.camera{background:#15171c}video{position:absolute;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);filter:contrast(1.08) saturate(.75)}.camera-shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,8,12,.2),transparent 45%,rgba(6,8,12,.28));pointer-events:none}
.scan{position:absolute;left:9%;right:9%;top:17%;bottom:12%;border:1px solid rgba(104,215,223,.23);clip-path:polygon(0 0,18px 0,18px 3px,3px 3px,3px 18px,0 18px,0 0,100% 0,100% 18px,97px 18px,97px 3px,calc(100% - 18px) 3px,calc(100% - 18px) 0)}
.target-box{position:absolute;left:50%;top:47%;width:220px;height:290px;transform:translate(-50%,-50%);border:2px solid rgba(104,215,223,.75);border-radius:48% 48% 38% 38%;box-shadow:0 0 20px rgba(104,215,223,.12),inset 0 0 22px rgba(104,215,223,.06);opacity:.8;transition:.25s}.target-box.bad{border-color:var(--red);box-shadow:0 0 28px rgba(239,60,54,.25)}
.hand-icon{position:absolute;right:18px;bottom:18px;width:44px;height:44px;border:1px solid #454954;display:grid;place-items:center;font-size:20px;background:rgba(10,12,16,.7)}
.stage{background:radial-gradient(circle at 50% 42%,#272b35 0,#171920 44%,#0a0b0e 100%)}.stage:before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:28px 28px}.stage:after{content:'';position:absolute;left:-10%;right:-10%;bottom:-8%;height:26%;background:repeating-linear-gradient(90deg,transparent 0 20px,rgba(238,234,224,.07) 21px 22px);transform:perspective(300px) rotateX(48deg)}
.versus{position:absolute;inset:50px 22px 22px;display:flex;align-items:flex-end;justify-content:center}.fighter{position:absolute;bottom:4%;width:48%;height:82%;transition:.25s}.fighter.left{left:-1%;filter:drop-shadow(-12px 14px 10px rgba(0,0,0,.45))}.fighter.right{right:-2%;transform:scaleX(-1);filter:drop-shadow(-12px 14px 10px rgba(0,0,0,.45))}.fighter svg{width:100%;height:100%;overflow:visible}
.enemy-name{position:absolute;right:14px;top:14px;text-align:right}.enemy-name small{display:block;color:#858994;font-family:'DM Mono';font-size:8px}.enemy-name strong{font-size:16px}.health{position:absolute;right:14px;top:44px;width:210px;height:8px;border:1px solid #555b66}.health i{display:block;height:100%;width:82%;background:var(--yellow);transition:.35s}
.callout{position:absolute;z-index:8;left:50%;top:20%;transform:translate(-50%,0) skew(-8deg);font-family:'Black Han Sans';font-size:38px;text-shadow:4px 4px 0 #111,0 0 18px rgba(255,212,59,.5);opacity:0}.callout.show{animation:pop .8s ease-out}@keyframes pop{0%{opacity:0;transform:translate(-50%,20px) scale(.5) skew(-8deg)}25%{opacity:1;transform:translate(-50%,0) scale(1.18) skew(-8deg)}100%{opacity:0;transform:translate(-50%,-30px) scale(1) skew(-8deg)}}
.burst{position:absolute;z-index:7;left:50%;top:50%;width:10px;height:10px;border-radius:50%;pointer-events:none}.burst:before,.burst:after{content:'';position:absolute;left:-500px;top:-500px;width:1000px;height:1000px;background:repeating-conic-gradient(from 10deg,transparent 0 7deg,var(--yellow) 8deg 9deg,transparent 10deg 15deg);opacity:0}.burst.fire:before{animation:burst .55s ease-out}@keyframes burst{0%{opacity:.9;transform:scale(.05)}100%{opacity:0;transform:scale(.45)}}
.moves{display:grid;grid-template-rows:62px 1fr 76px}.titlebar{display:flex;align-items:center;padding:0 16px;border-bottom:1px solid #343740}.titlebar b{font-size:14px}.titlebar span{margin-left:auto;font-family:'DM Mono';font-size:9px;color:#777c87}.move-list{padding:12px;overflow:auto}.move{position:relative;width:100%;height:92px;margin-bottom:8px;border:1px solid #343740;background:#15171d;text-align:left;padding:12px 12px 10px 64px;cursor:pointer;transition:.15s}.move:hover,.move.active{border-color:#747a88;background:#1b1e25}.move.active{box-shadow:inset 3px 0 var(--red)}.move-num{position:absolute;left:12px;top:12px;width:38px;height:38px;border:1px solid #484d58;border-radius:50%;display:grid;place-items:center;font-family:'DM Mono';font-size:11px}.move:nth-child(2) .move-num{color:var(--cyan);border-color:var(--cyan)}.move:nth-child(3) .move-num{color:var(--yellow);border-color:var(--yellow)}.move h3{font-size:13px;margin:0 0 5px}.move p{font-family:'DM Mono';font-size:8px;line-height:1.5;color:#8d919b;margin:0}.move .keys{position:absolute;right:8px;bottom:8px;font-family:'DM Mono';font-size:8px;color:#777b86}.footer-btn{border:0;border-top:1px solid #343740;background:#11131a}.cast{width:100%;height:100%;border:0;background:var(--red);font-family:'Black Han Sans';font-size:17px;letter-spacing:1px;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);transition:.15s}.cast:active{transform:scale(.97);background:#ff504a}.cast span{font-family:'DM Mono';font-size:9px;margin-left:8px;vertical-align:middle}
.bottombar{display:flex;align-items:center;padding:0 28px;border-top:1px solid #303239;background:#0b0c10;z-index:10}.combo{display:flex;align-items:center}.combo strong{font-family:'Black Han Sans';font-size:28px;color:var(--yellow);margin-right:8px}.combo small{font-family:'DM Mono';font-size:9px;color:#858994}.progress{margin-left:44px;display:flex;gap:5px}.dot{width:38px;height:5px;background:#343740;transform:skew(-18deg)}.dot.on{background:var(--cyan);box-shadow:0 0 8px rgba(104,215,223,.4)}.message{margin-left:auto;font-family:'DM Mono';font-size:10px;color:#9da1ab}.message b{color:var(--cyan)}
.flash{position:absolute;z-index:20;inset:0;background:white;pointer-events:none;opacity:0}.flash.on{animation:flash .35s}@keyframes flash{0%{opacity:.8}100%{opacity:0}}
.camera-off{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:radial-gradient(circle,#252832,#111318);z-index:4}.camera-off button{margin-top:12px;border:1px solid #626775;background:#181a20;padding:12px 18px;font-family:'DM Mono';font-size:10px;cursor:pointer}.camera-off h2{font-size:15px;margin:0}.camera-off p{font-size:10px;color:#9297a3;max-width:220px}
@media(max-width:900px){.app{grid-template-rows:58px 1fr 68px}.topbar{padding:0 14px}.stats{gap:12px}.energy{width:70px}.main{grid-template-columns:38% 62%;padding:6px;gap:6px}.moves{position:absolute;right:6px;bottom:74px;width:220px;height:auto;z-index:12}.titlebar,.move-list{display:none}.footer-btn{height:64px;border:0}.move{height:70px}.stage .enemy-name{transform:scale(.8);transform-origin:top right}.target-box{width:150px;height:210px}.message{display:none}}
@media(max-width:600px){.main{grid-template-columns:32% 68%}.camera{min-height:0}.target-box{width:110px;height:160px}.moves{width:180px}.stat:first-child{display:none}.fighter{width:65%}.fighter.left{left:-18%}.fighter.right{right:-18%}.health{width:130px}.callout{font-size:28px}}
</style>
</head>
<body>
<div class="app">
<header class="topbar"><div class="logo">ANIME <b>//</b> SIGNAL</div><div class="stats"><div class="stat"><small>TEMPORADA</small><strong>07 / 12</strong></div><div class="stat"><small>ENERGIA AURA</small><div class="energy"><i id="energy"></i></div></div></div></header>
<main class="main">
<section class="panel camera" id="cameraPanel"><div class="panel-label">CAMERA_FEED // LIVE</div><video id="video" playsinline muted></video><canvas id="canvas" hidden></canvas><div class="camera-shade"></div><div class="scan"></div><div class="target-box" id="targetBox"></div><div class="hand-icon">✦</div><div class="camera-off" id="cameraOff"><div><h2>CÂMERA DESLIGADA</h2><p>Ative para detectar seus gestos. Você também pode jogar com os botões.</p><button id="startCamera">ATIVAR CÂMERA</button></div></div></section>
<section class="panel stage"><div class="panel-label">ARENA // TOKYO-09</div><div class="enemy-name"><small>NÍVEL 03 • SHADOW</small><strong>KURO ZEN</strong></div><div class="health"><i id="enemyHealth"></i></div><div class="callout" id="callout">RAIJIN KICK!</div><div class="burst" id="burst"></div><div class="versus">
<div class="fighter left" id="fighterLeft"><svg viewBox="0 0 300 500" aria-label="Lutador"><defs><linearGradient id="coat" x2="1" y2="1"><stop stop-color="#343a47"/><stop offset="1" stop-color="#171922"/></linearGradient></defs><path d="M112 171l75 12 32 202-70 15-66-11z" fill="url(#coat)" stroke="#090a0d" stroke-width="8"/><path d="M111 175l-42 91 40 24 23-93zM188 184l54 66-31 35-43-82z" fill="#252934" stroke="#090a0d" stroke-width="8"/><path d="M68 267l31 19-18 41-43-24zM241 250l25 34-27 43-38-35z" fill="#d0b09a" stroke="#090a0d" stroke-width="8"/><path d="M143 378l-48 102h51l21-67 24 67h52l-70-111z" fill="#20232d" stroke="#090a0d" stroke-width="8"/><ellipse cx="153" cy="128" rx="64" ry="72" fill="#d7b59f" stroke="#090a0d" stroke-width="8"/><path d="M91 135l-9-44 31-48 43-24 52 40 18 64-24-29-17 12-29-38-30 28-15 59z" fill="#edf0f4" stroke="#090a0d" stroke-width="9"/><path d="M99 84l21-45 34 5-21 39zM149 44l40-21 31 38-45 22zM100 89l-24 27 39-2z" fill="#bfc5ce"/><path d="M119 132l27-5M166 127l24 7" stroke="#11131a" stroke-width="7"/><path d="M142 164l36 1" stroke="#9b3633" stroke-width="5"/><path d="M46 300l-24-31M239 323l28 35" stroke="#d0b09a" stroke-width="18" stroke-linecap="round"/></svg></div>
<div class="fighter right" id="fighterRight"><svg viewBox="0 0 300 500"><path d="M112 171l75 12 32 202-70 15-66-11z" fill="#18101d" stroke="#090a0d" stroke-width="8"/><path d="M111 175l-42 91 40 24 23-93zM188 184l54 66-31 35-43-82z" fill="#24152c" stroke="#090a0d" stroke-width="8"/><path d="M68 267l31 19-18 41-43-24zM241 250l25 34-27 43-38-35z" fill="#a8a0c5" stroke="#090a0d" stroke-width="8"/><path d="M143 378l-48 102h51l21-67 24 67h52l-70-111z" fill="#130d1c" stroke="#090a0d" stroke-width="8"/><ellipse cx="153" cy="128" rx="64" ry="72" fill="#aaa2be" stroke="#090a0d" stroke-width="8"/><path d="M92 139l-8-55 22-51 50-17 44 32 27 71-34-38-26 15-37-47-20 44z" fill="#17131f" stroke="#090a0d" stroke-width="9"/><path d="M119 132l27-5M166 127l24 7" stroke="#ef3c36" stroke-width="7"/><path d="M142 164l36 1" stroke="#4b3857" stroke-width="5"/><circle cx="132" cy="129" r="4" fill="#ff4545"/><circle cx="178" cy="129" r="4" fill="#ff4545"/></svg></div></div></section>
<section class="panel moves"><div class="titlebar"><b>GOLPE-SEQUÊNCIA</b><span>03 DISPONÍVEIS</span></div><div class="move-list">
<button class="move active" data-move="0"><span class="move-num">01</span><h3>RAIJIN • IMPACTO</h3><p>BRAÇO EM X<br>ÁREA • PEQUENO DANO</p><span class="keys">W / 1</span></button>
<button class="move" data-move="1"><span class="move-num">02</span><h3>KAZE • CORTE</h3><p>MÃO AO LADO<br>ÁREA • VELOCIDADE</p><span class="keys">A / 2</span></button>
<button class="move" data-move="2"><span class="move-num">03</span><h3>YAMI • EXPLOSÃO</h3><p>PUNHO FECHADO<br>FOCO • DANO ALTO</p><span class="keys">S / 3</span></button>
</div><div class="footer-btn"><button class="cast" id="cast">EXECUTAR GOLPE <span>[ ESPAÇO ]</span></button></div></section>
</main>
<footer class="bottombar"><div class="combo"><strong id="combo">x4</strong><small>COMBO<br>CHAIN</small></div><div class="progress"><i class="dot on"></i><i class="dot on"></i><i class="dot on"></i><i class="dot" id="dot4"></i><i class="dot"></i></div><div class="message" id="status">STATUS: <b>GESTO RECONHECIDO</b></div></footer><div class="flash" id="flash"></div>
</div>
<script>
const video=document.querySelector('#video'), cameraOff=document.querySelector('#cameraOff'), target=document.querySelector('#targetBox'), callout=document.querySelector('#callout'), burst=document.querySelector('#burst'), flash=document.querySelector('#flash');
let selected=0, combo=4, energy=67, enemy=82, stream=null;
document.querySelectorAll('.move').forEach((b,i)=>b.onclick=()=>select(i));
function select(i){selected=i;document.querySelectorAll('.move').forEach((b,n)=>b.classList.toggle('active',n===i));}
document.querySelector('#startCamera').onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});video.srcObject=stream;await video.play();cameraOff.hidden=true;document.querySelector('#status').innerHTML='STATUS: <b>CÂMERA CONECTADA</b>';requestAnimationFrame(trackMotion)}catch(e){cameraOff.querySelector('p').textContent='Sem acesso à câmera. Use os controles abaixo ou os atalhos do teclado.'}};
let ctx=null,prev=null,score=0;
function trackMotion(){if(!stream)return;const c=document.querySelector('#canvas');c.width=160;c.height=120;if(!ctx)ctx=c.getContext('2d',{willReadFrequently:true});ctx.save();ctx.scale(-1,1);ctx.drawImage(video, -160,0,160,120);ctx.restore();const data=ctx.getImageData(0,0,160,120).data;let motion=0;if(prev){for(let i=0;i<data.length;i+=64){const d=Math.abs(data[i]-prev[i])+Math.abs(data[i+1]-prev[i+1])+Math.abs(data[i+2]-prev[i+2]);motion+=d}}prev=data.slice();if(motion>8500){score=Math.min(100,score+3);target.classList.add('bad')}else{score=Math.max(0,score-1);target.classList.remove('bad')}document.querySelector('#status').innerHTML=motion>8500?'STATUS: <b>MOVIMENTO DETECTADO</b>':'STATUS: <b>GESTO RECONHECIDO</b>';if(score>65&&motion>8500)setTimeout(()=>{if(score>65)cast()},650);requestAnimationFrame(trackMotion)}
function cast(){const names=['RAIJIN • IMPACTO','KAZE • CORTE','YAMI • EXPLOSÃO'],dmg=[10,8,16];callout.textContent=names[selected];callout.classList.remove('show');void callout.offsetWidth;callout.classList.add('show');burst.classList.remove('fire');void burst.offsetWidth;burst.classList.add('fire');flash.classList.remove('on');void flash.offsetWidth;flash.classList.add('on');enemy=Math.max(0,enemy-dmg[selected]);document.querySelector('#enemyHealth').style.width=enemy+'%';energy=Math.max(8,energy-dmg[selected]*1.3);document.querySelector('#energy').style.width=energy+'%';combo++;document.querySelector('#combo').textContent='x'+combo;document.querySelector('#dot4').classList.toggle('on',combo%2===0);document.querySelector('#fighterLeft').animate([{transform:'translateX(0)'},{transform:'translateX(30px) scale(1.04)'},{transform:'translateX(0)'}],{duration:350});if(enemy===0){setTimeout(()=>{enemy=100;document.querySelector('#enemyHealth').style.width='100%';callout.textContent='K.O.!';callout.classList.add('show';},500)}}
document.querySelector('#cast').onclick=cast;
window.addEventListener('keydown',e=>{if(e.key===' '){e.prevent();cast()}if(['1','w','W'].includes(e.key))select(0);if(['2','a','A'].includes(e.key))select(1);if(['3','s','S'].includes(e.key))select(2)});
</script>
</body>
</html>
