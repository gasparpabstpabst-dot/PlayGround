<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Metro Rush</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=DM+Mono:wght@500&display=swap');
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#93daf5;font-family:'Baloo 2',system-ui,sans-serif;touch-action:none;user-select:none}canvas{display:block;width:100%;height:100%}.hud{position:absolute;inset:0;pointer-events:none}.top{position:absolute;left:22px;right:22px;top:18px;display:flex;justify-content:space-between;align-items:flex-start}.score{text-shadow:0 3px 0 #133c7a;color:white;font-size:25px;line-height:.9}.score small{display:block;font-family:'DM Mono';font-size:9px;letter-spacing:2px;margin-bottom:7px}.coins{height:44px;min-width:112px;border-radius:24px;background:rgba(17,45,86,.82);border:2px solid rgba(255,255,255,.45);color:white;display:flex;align-items:center;padding:0 14px;font-size:19px}.coin{width:24px;height:24px;margin-right:8px;border-radius:50%;background:#ffd84a;border:3px solid #fff09a;box-shadow:0 3px 0 #d58b15,inset 0 0 0 3px #f2a91c}.best{position:absolute;right:24px;top:76px;color:white;text-shadow:0 2px 0 #1c4c88;font-family:'DM Mono';font-size:10px;text-align:right}.start,.gameover{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(180deg,rgba(60,176,228,.12),rgba(16,70,125,.28));pointer-events:auto}.card{text-align:center;transform:translateY(-4vh)}.brand{font-size:clamp(54px,11vw,108px);line-height:.78;color:#fff;text-shadow:0 7px 0 #174f96,0 12px 0 #102b54,-4px -4px 0 #ff5e78,4px 4px 0 #ffc928;letter-spacing:-5px}.brand em{display:block;font-size:.48em;font-style:normal;color:#ffda39;text-shadow:0 5px 0 #dc7c1e,0 9px 0 #174f96}.runner-icon{width:88px;height:88px;margin:22px auto 12px;border-radius:50%;background:#ffcf4a;border:5px solid white;box-shadow:0 7px 0 #1c64a2;display:grid;place-items:center;font-size:48px}.play{border:0;border-radius:16px;background:#ff4f69;color:white;font-family:'Baloo 2';font-size:24px;padding:12px 34px 8px;box-shadow:0 7px 0 #ad2946,0 12px 25px rgba(12,55,102,.28);cursor:pointer}.play:active{transform:translateY(5px);box-shadow:0 2px 0 #ad2946}.tip{margin-top:22px;color:white;font-family:'DM Mono';font-size:9px;text-shadow:0 2px 3px #1c4c88}.hidden{display:none!important}.go-score{color:white;text-shadow:0 4px 0 #174f96;font-size:42px}.go-score small{display:block;font-family:'DM Mono';font-size:10px}.controls{position:absolute;inset:auto 20px 20px;display:flex;justify-content:space-between;pointer-events:none}.control{width:58px;height:58px;border:2px solid rgba(255,255,255,.55);border-radius:50%;display:grid;place-items:center;color:white;background:rgba(23,79,123,.42);font-size:23px;opacity:.9}
@media(max-width:600px){.top{left:12px;right:12px}.controls{bottom:12px}.brand{letter-spacing:-3px}.tip{display:none}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud">
<div class="top"><div class="score"><small>DISTÂNCIA</small><span id="dist">0000</span></div><div class="coins"><i class="coin"></i><span id="coins">0</span></div></div><div class="best">MELHOR<br><span id="best">0</span></div>
</div>
<div class="start" id="start"><div class="card"><div class="brand">METRO<em>RUSH</em></div><div class="runner-icon">⚡</div><button class="play" id="play">CORRER</button><div class="tip">SETAS / ARRASTE PARA DESVIAR • SETA PARA CIMA PULA • PARA BAIXO SLIDE</div></div></div>
<div class="gameover hidden" id="gameover"><div class="card"><div class="brand" style="font-size:65px">GAME<br><em>OVER</em></div><div class="go-score"><small>PONTUAÇÃO</small><span id="final">0</span></div><button class="play" id="again" style="margin-top:24px">DE NOVO</button></div></div>
<div class="controls"><div class="control">◀</div><div class="control">▶</div></div>
<script>
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');let W,H,dpr,clock=0,running=false,gameOver=false;
const state={lane:1,x:0,y:0,vy:0,sliding:0,dist:0,coins:0,speed:.55,best:+localStorage.metroRushBest||0,spawn:0};
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
document.querySelector('#best').textContent=state.best;
const items=[];
function laneX(l,z=1){return W/2+(l-1)*Math.min(W*.19,150)*(.3+z*.7)}
function reset(){Object.assign(state,{lane:1,x:0,y:0,vy:0,sliding:0,dist:0,coins:0,speed:.55,spawn:0});items.length=0;clock=0;gameOver=false;running=true;document.querySelector('#start').classList.add('hidden');document.querySelector('#gameover').classList.add('hidden')}
document.querySelector('#play').onclick=reset;document.querySelector('#again').onclick=reset;
function move(dir){if(!running)return;state.lane=Math.max(0,Math.min(2,state.lane+dir));}
function jump(){if(!running||state.y<1||state.sliding)return;state.vy=13}
function slide(){if(!running)return;state.sliding=24}
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')move(-1);if(e.key==='ArrowRight'||e.key==='d')move(1);if(e.key==='ArrowUp'||e.key==='w'||e.key===' ')jump();if(e.key==='ArrowDown'||e.key==='s')slide();if(!running&&(e.key==='Enter'||e.key===' '))reset()});
let tx=0,ty=0;addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>25)move(dx>0?1:-1);else if(dy<-25)jump();else if(dy>25)slide()},{passive:true});
function spawnRow(){const pattern=Math.random();if(pattern<.35){let lane=Math.floor(Math.random()*3);items.push({lane,z:1.05,type:'coin',col:lane,row:0}) ;for(let i=1;i<5;i++)items.push({lane,z:1.05+i*.12,type:'coin',col:lane,row:i})}else if(pattern<.75){let lane=Math.floor(Math.random()*3);items.push({lane,z:1.05,type:Math.random()<.5?'barrier':'train',col:lane,row:0});if(Math.random()<.5){let lane2=(lane+1+Math.floor(Math.random()*2))%3;items.push({lane:lane2,z:1.05,type:'coin',col:lane2,row:0})}}else{for(let i=0;i<3;i++)if(Math.random()<.75)items.push({lane:i,z:1.05,type:'coin',col:i,row:0})}}
function project(lane,z){const horizon=H*.27,ground=H*.94;let p=(1.05-z)/1.05;p=p<0?0:p;const y=horizon+(ground-horizon)*p*p;return {x:laneX(lane,p),y:y,s:.18+p*.82,p}}
function poly(points,fill){ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath();ctx.fillStyle=fill;ctx.fill()}
function drawWorld(){let horizon=H*.27,ground=H*.94;const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#78cef4');sky.addColorStop(.38,'#b9ebfa');sky.addColorStop(.38,'#f4bc6a');sky.addColorStop(1,'#e3a95b');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
// clouds
ctx.fillStyle='rgba(255,255,255,.78)';for(let i=-1;i<5;i++){let x=((i*260-clock*2)%1100+1100)%1100-150,y=horizon*(.25+(i%3)*.12);ctx.beginPath();ctx.arc(x,y,28,0,7);ctx.arc(x+35,y-12,38,0,7);ctx.arc(x+72,y,27,0,7);ctx.fill()} 
// city
for(let i=0;i<14;i++){let x=(i*87-clock*4)%1250-80,w=45+(i%4)*18,h=80+(i%5)*28;ctx.fillStyle=i%2?'#f4a257':'#ec7a65';ctx.fillRect(x,horizon-h,w,h);ctx.fillStyle='rgba(255,224,154,.8)';for(let r=0;r<3;r++)for(let c=0;c<2;c++)ctx.fillRect(x+10+c*17,horizon-h+12+r*22,7,10)}
// tracks and sleepers
ctx.fillStyle='#7e8b86';ctx.beginPath();ctx.moveTo(W*.32,horizon);ctx.lineTo(W*.68,horizon);ctx.lineTo(W*.91,ground);ctx.lineTo(W*.09,ground);ctx.fill();for(let i=0;i<3;i++){let l=i;ctx.strokeStyle='#453f42';ctx.lineWidth=Math.max(3,W*.008);ctx.beginPath();let a=project(l,.04),b=project(l,1.05);ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}for(let z=.0;z<1.05;z+=.09){let q=((z-clock*.002*state.speed)%1.1+1.1)%1.1;let a=project(0,q),b=project(2,q);ctx.fillStyle='#b68f5f';ctx.fillRect(a.x,a.y-(2+q*8),b.x-a.x,3+q*7)}
// side buildings
ctx.fillStyle='#315c69';poly([[W*.09,ground],[W*.32,horizon],[W*.28,horizon],[0,ground]],'#315c69');poly([[W*.91,ground],[W*.68,horizon],[W*.72,horizon],[W,ground]],'#69455c');}
function drawCoin(o){let q=project(o.lane,o.z),r=13*q.s;ctx.save();ctx.translate(q.x,q.y-r);ctx.rotate(Math.sin(clock*.12+o.row)*.45);ctx.fillStyle='#f7b927';ctx.beginPath();ctx.ellipse(0,0,r*.72,r,0,0,7);ctx.fill();ctx.lineWidth=4*q.s;ctx.strokeStyle='#fff0a0';ctx.stroke();ctx.beginPath();ctx.ellipse(0,0,r*.35,r*.62,0,0,7);ctx.stroke();ctx.restore()}
function drawBarrier(o){let q=project(o.lane,o.z),w=70*q.s,h=70*q.s;ctx.save();ctx.translate(q.x,q.y-h);ctx.fillStyle='#cc3e49';ctx.fillRect(-w*.5,0,w,h*.55);ctx.fillStyle='#fff0df';for(let i=-2;i<3;i++){ctx.beginPath();ctx.moveTo(i*w*.22,0);ctx.lineTo(i*w*.22+18*q.s,0);ctx.lineTo(i*w*.22+10*q.s,h*.55);ctx.lineTo(i*w*.22-8*q.s,h*.55);ctx.fill()}ctx.fillStyle='#5b5052';ctx.fillRect(-w*.45,h*.55,w*.16,h*.45);ctx.fillRect(w*.29,h*.55,w*.16,h*.45);ctx.restore()}
function drawTrain(o){let q=project(o.lane,o.z),w=105*q.s,h=150*q.s;ctx.save();ctx.translate(q.x,q.y-h);ctx.fillStyle='#e9f0eb';ctx.fillRect(-w*.5,0,w,h);ctx.fillStyle='#4aa4ca';ctx.fillRect(-w*.42,h*.12,w*.84,h*.34);ctx.fillStyle='#27384b';ctx.fillRect(-w*.32,h*.16,w*.64,h*.22);ctx.fillStyle='#f0aa31';ctx.fillRect(-w*.38,h*.72,w*.76,h*.08);ctx.fillStyle='#d8434b';ctx.fillRect(-w*.5,h*.82,w,h*.18);ctx.restore()}
function drawPlayer(){let q={x:W/2+(state.lane-1)*Math.min(W*.19,150),y:H*.79-state.y*W*.055};ctx.save();ctx.translate(q.x,q.y);let scale=Math.max(.65,Math.min(1.15,W/900));ctx.scale(scale,scale);if(state.sliding>0){ctx.rotate(-.18);ctx.fillStyle='#203a68';ctx.fillRect(-48,12,96,28);ctx.fillStyle='#f15c46';ctx.fillRect(-38,-18,76,35);ctx.fillStyle='#f2bd8f';ctx.beginPath();ctx.arc(42,-10,18,0,7);ctx.fill();ctx.fillStyle='#2d2d42';ctx.fillRect(-50,28,44,12);ctx.fillRect(20,28,44,12)}else{ctx.fillStyle='#203a68';ctx.fillRect(-26,-82,52,72);ctx.fillStyle='#ef5b49';ctx.beginPath();ctx.moveTo(-26,-82);ctx.lineTo(26,-82);ctx.lineTo(37,-25);ctx.lineTo(-38,-25);ctx.fill();ctx.fillStyle='#f2bd8f';ctx.beginPath();ctx.arc(0,-110,27,0,7);ctx.fill();ctx.fillStyle='#2b2b3e';ctx.beginPath();ctx.arc(0,-116,29,Math.PI,0);ctx.lineTo(18,-111);ctx.fill();ctx.fillStyle='#f2bd8f';ctx.fillRect(-48,-70,18,58);ctx.fillRect(30,-70,18,58);ctx.fillStyle='#263451';ctx.fillRect(-24,-12,20,65);ctx.fillRect(4,-12,20,65);ctx.fillStyle='#f1aa37';ctx.fillRect(-24,48,24,13);ctx.fillRect(4,48,24,13)}ctx.restore()}
function end(){running=false;gameOver=true;let best=Math.max(state.best,Math.floor(state.dist));state.best=best;localStorage.metroRushBest=best;document.querySelector('#best').textContent=best;document.querySelector('#final').textContent=Math.floor(state.dist)+state.coins*10;document.querySelector('#gameover').classList.remove('hidden')}
function update(){if(running){clock++;state.speed=Math.min(1.15,.55+state.dist/15000);state.dist+=state.speed*2.2;state.spawn-=state.speed;if(state.spawn<0){spawnRow();state.spawn=30-Math.min(12,state.dist/180)};state.y+=state.vy*.035;state.vy-=.72;if(state.y<0){state.y=0;state.vy=0};state.x+=(state.lane-state.x)*.18;if(state.sliding>0)state.sliding--;if(items.length&&items[0].z<-.1)items.shift();for(let i=items.length-1;i>=0;i--){let o=items[i];o.z-=.0038*state.speed;if(o.z<.12&&o.z>.02&&o.lane===state.lane){if(o.type==='coin'){state.coins++;items.splice(i,1)}else if(o.type==='barrier'&&state.y<.55)end();else if(o.type==='train')end()} }document.querySelector('#dist').textContent=String(Math.floor(state.dist)).padStart(4,'0');document.querySelector('#coins').textContent=state.coins}}
function draw(){drawWorld();let sorted=[...items].sort((a,b)=>b.z-a.z);for(let o of sorted){if(o.z<-.02||o.z>1.07)continue;if(o.type==='coin')drawCoin(o);if(o.type==='barrier')drawBarrier(o);if(o.type==='train')drawTrain(o)}drawPlayer();update();requestAnimationFrame(draw)}draw();
</script>
</body>
</html>
